<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>シークレットページ</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background: linear-gradient(to bottom, #1c1c1c, #3a3a3a);
      background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
      color: #f5f5f5;
    }
    .container {
      max-width: 500px;
      margin: 100px auto 0 auto;
      background: rgba(255,248,230,0.97);
      border: 2px solid #4b3616;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(60,40,20,0.3);
      padding: 40px 30px 30px 30px;
      text-align: center;
    }
    h1 {
      font-family: 'Georgia', serif;
      font-size: 2em;
      color: #3c2d14;
      margin-bottom: 15px;
      text-shadow: 1px 1px 0 #c9b998;
    }
    .mystery {
      font-size: 1.2em;
      color: #6e4b1c;
      margin-bottom: 25px;
    }
    .text {
      font-size: 1.1em;
      margin-bottom: 15px;
    }
    .footer {
      margin-top: 30px;
      font-size: 0.9em;
      color: #6e4b1c;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="text">
      <p>このページには、友人だけが知るべき真実が書かれています。</p>
    </div>
  </div>
</body>
</html>
