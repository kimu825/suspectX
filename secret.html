<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>シークレットページ</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background: url('https://www.transparenttextures.com/patterns/brick-wall.png') repeat fixed;
      background-color: #b04a2b;
      color: #2c1a0b;
    }
    .container {
      max-width: 800px;
      margin: 100px auto 0 auto;
      background: rgba(255,248,230,0.97);
      border: 2px solid #4b3616;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(60,40,20,0.3);
      padding: 40px 30px 30px 30px;
      text-align: center;
    }
    h1 {
      font-size: 2em;
      color: #3c2d14;
      margin-bottom: 15px;
      text-shadow: 1px 1px 0 #c9b998;
    }
    .text {
      font-size: 1.1em;
      margin-bottom: 25px;
    }
    input[type="password"] {
      padding: 7px 12px;
      font-size: 1em;
      border: 1px solid #8d6e46;
      border-radius: 5px;
      background: #f9ecd3;
      margin-bottom: 15px;
      width: 80%;
    }
    button {
      padding: 8px 20px;
      font-size: 1em;
      border-radius: 5px;
      background-color: #6e4b1c;
      color: #fff6e1;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(80,60,30,0.2);
      transition: background 0.2s;
    }
    button:hover {
      background-color: #a1845e;
      color: #fff;
    }
    .error {
      color: #a02a2a;
      margin-top: 10px;
      font-weight: bold;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="text">
      <p>
      あなたは「違う、私じゃない」と弁明する容疑者に、完璧な推理を突きつけた!<br>
      しかし、証拠不十分で釈放されてしまった！<br>
      <br>
      後日、警察から提供された調査資料に誤りがあることが判明した。<br>
      なんと、一部の資料で署名者が入れ替わってしまっていたのだ。<br>
      <br>
      資料を正しく修正し、すべての謎を解き明かそう!
      </p>
    </div>

    <!-- 2つ目のパスワード入力フォーム -->
    <input type="text" id="nextPassword" placeholder="犯人の苗字をカタカナで入力">
    <button onclick="checkNextPassword()">事件を解決する</button>
    <div id="error" class="error"></div>
  </div>

  <script>
    function checkNextPassword() {
      const input = document.getElementById('nextPassword').value;
      const correctPassword = "truth"; // ← ここでパスワードを設定できます

      if (input === correctPassword) {
        window.location.href = "final.html";
      } else {
        document.getElementById('error').textContent = "推理が間違っているようです。";
      }
    }
  </script>
</body>
</html>
