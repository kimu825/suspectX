<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>アンサーページ</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background: url('https://www.transparenttextures.com/patterns/brick-wall.png') repeat fixed;
      background-color: #2c1a0b;
      color: #fff6e1;
    }
    .container {
      max-width: 600px;
      margin: 100px auto;
      background: rgba(50,30,10,0.95);
      border: 2px solid #a1845e;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      padding: 40px;
      text-align: center;
    }
    h1 {
      font-size: 2em;
      margin-bottom: 20px;
      color: #ffdca8;
      text-shadow: 1px 1px 2px #000;
    }
    p {
      font-size: 1.2em;
      margin-bottom: 30px;
    }
    .footer {
      font-size: 0.9em;
      color: #c9b998;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Congratulations!</h1>
    <p>あなたはすべての問題と謎を解き、真実にたどり着きました！</p>
  </div>
</body>
</html>
