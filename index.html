<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>パスワードページ</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background: url('https://www.transparenttextures.com/patterns/brick-wall.png') repeat fixed;
      background-color: #b04a2b;
      color: #2c1a0b;
    }
    .container {
      max-width: 400px;
      margin: 100px auto 0 auto;
      background: rgba(255,248,230,0.95);
      border: 2px solid #6e4b1c;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(60,40,20,0.3);
      padding: 30px 30px 20px 30px;
      text-align: center;
    }

    h1 {
      font-family: 'Georgia', serif;
      font-size: 2em;
      margin-bottom: 10px;
      letter-spacing: 2px;
      color: #3c2d14;
      text-shadow: 1px 1px 0 #c9b998;
    }

    h2 {
      font-size: 1.2em;
      margin-bottom: 20px;
      color: #6e4b1c;
    }

    .detective {
      margin-bottom: 15px;
      font-size: 1.2em;
      font-style: italic;
    }

    input[type="password"] {
      padding: 7px 12px;
      font-size: 1em;
      border: 1px solid #8d6e46;
      border-radius: 5px;
      background: #f9ecd3;
      margin-bottom: 15px;
      width: 80%;
    }

    button {
      padding: 8px 20px;
      font-size: 1em;
      border-radius: 5px;
      background-color: #6e4b1c;
      color: #fff6e1;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(80,60,30,0.2);
      transition: background 0.2s;
    }

    button:hover {
      background-color: #a1845e;
      color: #fff;
    }

    .error {
      color: #a02a2a;
      margin-top: 10px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .footer {
      margin-top: 20px;
      font-size: 0.9em;
      color: #6e4b1c;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <input type="text" id="password" placeholder="犯人の名前をカタカナで入力">
    <button onclick="checkPassword()">真相を暴く</button>
    <div id="error" class="error"></div>
  </div>

  <script>
    function checkPassword() {
      const input = document.getElementById('password').value;
      const correctPassword = "フリードリヒ";
      if (input === correctPassword) {
        window.location.href = "secret.html";
      } else {
        document.getElementById('error').textContent = "推理が間違っているようです。";
      }
    }
  </script>
</body>
</html>
