<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>パスワードページ</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background: url('https://www.transparenttextures.com/patterns/dark-mosaic.png') repeat fixed;
      background-color: #2c2c2c;
      color: #f5f5f5;
    }
    .container {
      background: rgba(40, 30, 20, 0.9);
      border: 2px solid #a1845e;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    h1, h2 {
      color: #d8c8a8;
      text-shadow: 1px 1px 2px #000;
    }
    button {
      background-color: #a1845e;
      color: #1c1c1c;
    }
    button:hover {
      background-color: #d8c8a8;
      color: #000;
    }
    .detective {
      margin-bottom: 15px;
      font-size: 1.2em;
      font-style: italic;
    }
    input[type="password"] {
      padding: 7px 12px;
      font-size: 1em;
      border: 1px solid #8d6e46;
      border-radius: 5px;
      background: #f9ecd3;
      margin-bottom: 15px;
      width: 80%;
    }
    .error {
      color: #a02a2a;
      margin-top: 10px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .footer {
      margin-top: 20px;
      font-size: 0.9em;
      color: #6e4b1c;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <input type="password" id="password" placeholder="パスワードを入力">
    <button onclick="checkPassword()">真相を暴く</button>
    <div id="error" class="error"></div>
  </div>
  <script>
    function checkPassword() {
      const input = document.getElementById('password').value;
      // ↓パスワードはここで変更できます
      const correctPassword = "friend";

      if (input === correctPassword) {
        window.location.href = "secret.html";
      } else {
        document.getElementById('error').textContent = "パスワードが違います。";
      }
    }
  </script>
</body>
</html>
